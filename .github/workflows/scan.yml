name: Hledat letenky
# Hlídač levných letenek z Prahy

on:
  schedule:
    # GitHub plánovaná spuštění často vynechává, proto se budí každou hodinu
    # a skript sám pozná, jestli je co dělat (letenky ~ každé 4 h, zájezdy ~ každých 6 h).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Jen poslat testovací upozornění (push + e-mail)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "config.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: letenky
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testovací upozornění
        if: ${{ inputs.test_notify }}
        run: node scripts/scan.mjs --test-notify

      - name: Co je potřeba udělat
        id: plan
        run: node scripts/plan.mjs "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Hledat levné letenky
        if: ${{ !inputs.test_notify && steps.plan.outputs.flights == 'true' }}
        env:
          DIGEST: ${{ steps.plan.outputs.digest }}
          DEFER_NOTIFY: "1"
        run: node scripts/scan.mjs

      - name: Hledat levné zájezdy
        if: ${{ !inputs.test_notify && steps.plan.outputs.tours == 'true' }}
        continue-on-error: true
        env:
          DEFER_NOTIFY: "1"
        run: node scripts/tours.mjs

      - name: Uložit data
        if: ${{ !inputs.test_notify && steps.plan.outputs.any == 'true' }}
        run: |
          git config user.name "hlidac-letenek"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data cache
          git diff --cached --quiet || git commit -m "Ceny letenek $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      - uses: actions/configure-pages@v5
        if: ${{ steps.plan.outputs.any == 'true' || inputs.test_notify }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.plan.outputs.any == 'true' || inputs.test_notify }}
        with:
          path: site
      - id: deploy
        if: ${{ steps.plan.outputs.any == 'true' || inputs.test_notify }}
        uses: actions/deploy-pages@v4

      # upozornění až po aktualizaci webu, aby po kliknutí byla vidět nová data
      - name: Poslat upozornění
        if: ${{ always() && !inputs.test_notify }}
        run: node scripts/outbox.mjs
