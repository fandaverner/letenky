name: Hledat letenky
# Hlídač levných letenek z Prahy

on:
  schedule:
    # UTC časy; 6:07 UTC = 7:07 v Praze (zimní čas) → ranní e-mailový přehled
    - cron: "7 2,6,10,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Jen poslat testovací upozornění (push + e-mail)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "config.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: letenky
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testovací upozornění
        if: ${{ inputs.test_notify }}
        run: node scripts/scan.mjs --test-notify

      - name: Hledat levné letenky
        if: ${{ !inputs.test_notify }}
        run: |
          if [ "$(date -u +%H)" = "06" ] && [ "${{ github.event_name }}" = "schedule" ]; then export DIGEST=true; fi
          node scripts/scan.mjs

      - name: Uložit data
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "hlidac-letenek"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data cache
          git diff --cached --quiet || git commit -m "Ceny letenek $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
