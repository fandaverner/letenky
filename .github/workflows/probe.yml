name: Průzkum webů cestovek (dočasné)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout ukázky
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          while read name url; do
            [ -z "$name" ] && continue
            code=$(curl -sL -A "$UA" -H "Accept-Language: de-DE,de;q=0.9" --compressed -m 30 -o "probe/$name.html" -w "%{http_code} %{size_download} %{url_effective}" "$url" || echo "ERR")
            echo "$name $code" | tee -a probe/_status.txt
            sleep 2
          done <<'LIST'
          c24_region https://urlaub.check24.de/suche/region?airport=PRG&transportType=flight&roomAllocation=A-A&departureDate=2026-11-21&returnDate=2026-12-31&days=7&pageArea=package&offerSort=price&areaSort=price
          c24_hotel https://urlaub.check24.de/suche/hotel?airport=PRG&transportType=flight&roomAllocation=A-A&departureDate=2026-11-21&returnDate=2026-12-31&days=8&page=1&pageArea=package&areaId=546&offerSort=price&areaSort=price&stacked=true
          c24_robots https://urlaub.check24.de/robots.txt
          vorflug_prg https://www.5vorflug.de/last-minute/?depap=PRG&dur=7
          vorflug_prg2 https://www.5vorflug.de/last-minute/?airport=PRG&dur=7
          vorflug_robots https://www.5vorflug.de/robots.txt
          ltur_search https://www.ltur.com/de/urlaub/last-minute.html
          LIST
      - name: Uložit
        run: |
          git config user.name "hlidac-letenek"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Průzkum webů cestovek [skip ci]" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
