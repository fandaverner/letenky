name: Průzkum webů cestovek (dočasné)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout ukázky
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          while read name url; do
            [ -z "$name" ] && continue
            code=$(curl -sL -A "$UA" -H "Accept-Language: de-DE,de;q=0.9" --compressed -m 30 -o "probe/$name.html" -w "%{http_code} %{size_download} %{url_effective}" "$url" || echo "ERR")
            echo "$name $code" | tee -a probe/_status.txt
            sleep 2
          done <<'LIST'
          ltur_home https://www.ltur.com/de/
          ltur_lm https://www.ltur.com/de/last-minute.html
          ltur_prag https://www.ltur.com/de/last-minute/ab-prag.html
          ltur_robots https://www.ltur.com/robots.txt
          aidu_prag https://www.ab-in-den-urlaub.de/abflughafen/prag
          aidu_robots https://www.ab-in-den-urlaub.de/robots.txt
          check24 https://urlaub.check24.de/pauschalreisen/last-minute
          holidaycheck https://www.holidaycheck.de/last-minute
          wegde https://www.weg.de/last-minute
          vorflug https://www.5vorflug.de/last-minute.html
          tui_lm https://www.tui.com/last-minute/
          lastminute_de https://www.lastminute.de/pauschalreisen/last-minute
          LIST
      - name: Uložit
        run: |
          git config user.name "hlidac-letenek"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Průzkum webů cestovek [skip ci]" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
