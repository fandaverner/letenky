name: Průzkum webů cestovek (dočasné)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout ukázky
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          while read name url; do
            [ -z "$name" ] && continue
            code=$(curl -sL -A "$UA" -H "Accept-Language: cs-CZ,cs;q=0.9" --compressed -m 30 -o "probe/$name.html" -w "%{http_code} %{size_download} %{url_effective}" "$url" || echo "ERR")
            echo "$name $code" | tee -a probe/_status.txt
            host=$(echo "$url" | awk -F/ '{print $1"//"$3}')
            curl -sL -A "$UA" -m 15 "$host/robots.txt" -o "probe/$name.robots.txt" || true
          done <<'LIST'
          cestujlevne https://www.cestujlevne.com/last-minute
          levnocestovani https://levnocestovani.cz/zajezdy/last-minute
          invia https://www.invia.cz/last-minute/
          fischer https://www.fischer.cz/last-minute
          exim https://www.eximtours.cz/last-minute
          cedok https://www.cedok.cz/last-minute/
          bluestyle https://www.blue-style.cz/last-minute/
          zajezdycz https://www.zajezdy.cz/last-minute/
          dovolenacz https://www.dovolena.cz/last-minute/
          slevomat https://www.slevomat.cz/cestovani/dovolena/last-minute
          nevdama https://www.nev-dama.cz/last-minute
          LIST
      - name: Uložit
        run: |
          git config user.name "hlidac-letenek"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Průzkum webů cestovek [skip ci]" && git push
